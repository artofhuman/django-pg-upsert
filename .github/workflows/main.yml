# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        django: ["4.2", "5.2", "6.0", "6.1"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Django 4.2 supports Python 3.8 - 3.12
          - django: "4.2"
            python-version: "3.13"
          - django: "4.2"
            python-version: "3.14"
          # Django 5.2 supports Python 3.10 - 3.14
          - django: "5.2"
            python-version: "3.9"
          # Django 6.x supports Python 3.12 - 3.14
          - django: "6.0"
            python-version: "3.9"
          - django: "6.0"
            python-version: "3.10"
          - django: "6.0"
            python-version: "3.11"
          - django: "6.1"
            python-version: "3.9"
          - django: "6.1"
            python-version: "3.10"
          - django: "6.1"
            python-version: "3.11"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install tox tox-gh-actions
    - name: Test with tox
      run: tox
      env:
        DJANGO: ${{ matrix.django }}
